[advisories]
yanked = "warn"
ignore = [
    #"RUSTSEC-0000-0000",
    # crypto-bigint (0.5.5) has timing variability in operations meant to be
    # constant-time. The fix is in >=0.7.6, which this graph cannot reach:
    # `elliptic-curve 0.13.8` requires `crypto-bigint ^0.5`, and the whole
    # RustCrypto stack arrives through `zkevm_opcode_defs`, which pins `k256`
    # and `p256` to `0.13.*`. Every published `zkevm_opcode_defs` does, so
    # there is no release to move to; it needs a bump in `zksync-protocol`
    # first. Not reachable here: `zkevm_opcode_defs` only re-exports `k256`
    # and `p256`, this repository uses it for address and enum constants and
    # the SHA-256 bytecode hash, and no symbol from `crypto-bigint`,
    # `elliptic-curve`, `k256`, `p256` or `ecdsa` is linked into `zksolc`. A
    # compiler also holds no secret material to leak through timing. Revisit
    # once `zkevm_opcode_defs` moves to `k256`/`p256` 0.14.
    "RUSTSEC-2026-0387",
]

[licenses]
allow = [
    #"Apache-2.0 WITH LLVM-exception",
    "MIT",
    "Apache-2.0",
    "ISC",
    "Unlicense",
    "MPL-2.0",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "CC0-1.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Zlib",
]
confidence-threshold = 0.8
exceptions = [
    # Each entry is the crate and version constraint, and its specific allow
    # list
    #{ allow = ["Zlib"], name = "adler32", version = "*" },
]

unused-allowed-license = "allow"

[licenses.private]
ignore = false
registries = [
    #"https://sekretz.com/registry
]

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = [
    #{ name = "ansi_term", version = "=0.11.0" },
]
# List of crates to deny
deny = [
    # Each entry the name of a crate and a version range. If version is
    # not specified, all versions will be matched.
    #{ name = "ansi_term", version = "=0.11.0" },
]

skip = [
    #{ name = "ansi_term", version = "=0.11.0" },
]
skip-tree = [
    #{ name = "ansi_term", version = "=0.11.0", depth = 20 },
]

[sources]
unknown-registry = "deny"
unknown-git = "allow"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[sources.allow-org]
#github = ["matter-labs"]
